<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>単語ノート</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--sub:#6b7280;--ac:#2f6fed;--acx:#fff;--bd:#e3e6ee;--ok:#16a34a;--mid:#d97706;--ng:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1c212b;--tx:#eef0f5;--sub:#9aa3b2;--ac:#6b9bff;--acx:#0b1220;--bd:#2d3442}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1c212b;--tx:#eef0f5;--sub:#9aa3b2;--ac:#6b9bff;--acx:#0b1220;--bd:#2d3442}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}
input,textarea{flex:1;min-width:0;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.w{font-size:26px;font-weight:700}.sub{color:var(--sub);font-size:14px}
ol{padding-left:20px;margin:8px 0}
.ex{border-left:3px solid var(--bd);padding-left:10px;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--ac)}
.badge{background:var(--ng);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:17px}
.dots{display:flex;gap:3px;margin-top:4px}.dots i{width:14px;height:5px;border-radius:3px;background:var(--bd)}.dots i.f{background:var(--ac)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate .ok{background:var(--ok);color:#fff}.rate .mid{background:var(--mid);color:#fff}.rate .ng{background:var(--ng);color:#fff}
.c{text-align:center}.hide{display:none}
.x{background:none;color:var(--sub);padding:6px 10px;font-size:20px}
</style>
</head>
<body>
<main>
<section id="v-search">
<h1>単語を調べる</h1>
<div class="card"><div class="row"><input id="q" placeholder="英単語を入力(例: resilient)" autocapitalize="none" autocomplete="off" spellcheck="false"><button id="go">調べる</button></div></div>
<div class="card"><div class="sub">英文を入力すると、句ごとに分けて意味を表示します</div>
<textarea id="txt" rows="3" placeholder="例: She decided to give up smoking for her health." style="width:100%;margin:8px 0;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></textarea>
<button id="sb" style="width:100%">句に分ける</button></div>
<div id="res"></div>
</section>
<section id="v-list" class="hide"><h1>単語帳</h1><div id="list"></div></section>
<section id="v-rev" class="hide"><h1>復習</h1><div id="rev"></div></section>
<section id="v-set" class="hide"><h1>設定</h1><div class="card">
<div class="sub">Gemini APIキー(Google AI Studioで取得)</div>
<input id="key" type="password" placeholder="AIza..." autocomplete="off" style="width:100%;margin:6px 0 10px">
<div class="sub">モデル名</div>
<input id="mdl" placeholder="gemini-2.5-flash" style="width:100%;margin:6px 0 12px">
<button id="sv" style="width:100%">保存</button><div id="svm" class="sub c" style="margin-top:8px"></div></div>
<div class="card"><div class="sub">通知は、復習できる単語があるときに約4時間おき(8〜22時)に届きます。</div>
<button class="g" id="tn" style="width:100%;margin-top:10px">テスト通知を送る</button></div></section>
</main>
<nav>
<button data-t="search" class="on">調べる</button>
<button data-t="list">単語帳</button>
<button data-t="rev">復習<span id="bd" class="badge hide">0</span></button>
<button data-t="set">設定</button>
</nav>
<script>
// 忘却曲線に沿った復習間隔(日): 1, 2, 4, 7, 15, 30, 60
const INT=[1,2,4,7,15,30,60],DAY=864e5,KEY="tango.v1";
let words=[],cur=null,sample=null,revCard=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{words=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){words=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}
  try{window.Android&&Android.sync(JSON.stringify(words.map(w=>w.due)))}catch(e){}}
const cfg=()=>{try{return JSON.parse(localStorage.getItem("tango.cfg")||"{}")}catch(e){return{}}};
async function gem(prompt){
  const c=cfg();if(!c.key)throw new Error("設定でAPIキーを入力してください");
  const m=c.model||"gemini-2.5-flash";
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json"}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||("HTTP "+r.status));
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
}
function renderSet(){const c=cfg();$("#key").value=c.key||"";$("#mdl").value=c.model||"";}
const due=()=>words.filter(w=>w.due<=Date.now()).sort((a,b)=>a.due-b.due);
function updBadge(){const n=due().length,b=$("#bd");b.textContent=n;b.classList.toggle("hide",!n)}
function show(t){
  for(const k of["search","list","rev","set"])$("#v-"+k).classList.toggle("hide",k!==t);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="set")renderSet();if(t==="list")renderList();if(t==="rev"){revCard=null;renderRev()}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

async function lookup(){
  const w=$("#q").value.trim().toLowerCase();
  if(!w)return;
  const res=$("#res"),btn=$("#go");
  if(!/^[a-z][a-z'\- ]*$/.test(w)){res.innerHTML='<div class="card sub">英単語を入力してください。</div>';return}
  btn.disabled=true;res.innerHTML='<div class="card sub">調べています…</div>';
  try{
    const r=await gem(`英単語「${w}」の辞書情報を日本語で返してください。JSONのみ。形式: {"word":"見出し語","pron":"発音記号","pos":"品詞(日本語)","meanings":["意味1","意味2"],"example":"英語の例文","example_ja":"例文の日本語訳"}。meaningsは重要な順に最大3つ。綴りが誤っている場合は最も近い正しい単語を使ってください。`);
    cur={word:String(r.word||w).toLowerCase(),pron:r.pron||"",pos:r.pos||"",meanings:(r.meanings||[]).slice(0,3),example:r.example||"",example_ja:r.example_ja||""};
    renderRes();
  }catch(e){
    cur=null;
    res.innerHTML=`<div class="card"><div class="sub">検索に失敗しました(${esc(e.message)})。設定を確認するか、意味を自分で入力して追加できます。</div><div class="row" style="margin-top:10px"><input id="man" placeholder="意味を入力"><button id="addm">追加</button></div></div>`;
    $("#addm").onclick=()=>{const m=$("#man").value.trim();if(!m)return;cur={word:w,pron:"",pos:"",meanings:[m],example:"",example_ja:""};add()};
  }
  btn.disabled=false;
}
function renderRes(){
  const c=cur,has=words.some(w=>w.word===c.word);
  $("#res").innerHTML=`<div class="card"><div class="item"><div><div class="w">${esc(c.word)}</div><div class="sub">${esc(c.pron)} ${esc(c.pos)}</div></div><button class="g" id="sp">🔊</button></div>
  <ol>${c.meanings.map(m=>`<li>${esc(m)}</li>`).join("")}</ol>
  ${c.example?`<div class="ex"><div>${esc(c.example)}</div><div class="sub">${esc(c.example_ja)}</div></div>`:""}
  <button id="add" style="width:100%;margin-top:14px" ${has?"disabled":""}>${has?"単語帳に追加済み":"単語帳に追加"}</button></div>`;
  $("#sp").onclick=()=>speak(c.word);$("#add").onclick=add;
}
function add(){
  if(!cur||words.some(w=>w.word===cur.word))return;
  words.push({...cur,stage:0,due:Date.now()+DAY,added:Date.now()});
  save();updBadge();
  $("#res").innerHTML=`<div class="card c">「${esc(cur.word)}」を追加しました。初回の復習は明日です。</div>`;
  $("#q").value="";cur=null;
}
function renderList(){
  const el=$("#list");
  if(!words.length){el.innerHTML='<div class="card sub c">まだ単語がありません。</div>';return}
  el.innerHTML=words.slice().sort((a,b)=>b.added-a.added).map(w=>{
    const d=w.due<=Date.now()?"復習できます":Math.ceil((w.due-Date.now())/DAY)+"日後に復習";
    return `<div class="card item"><div><b>${esc(w.word)}</b> <span class="sub">${esc(w.meanings[0]||"")}</span>
    <div class="dots">${INT.map((_,i)=>`<i class="${i<w.stage?"f":""}"></i>`).join("")}</div><div class="sub">${d}</div></div>
    <button class="x" data-w="${esc(w.word)}" aria-label="削除">×</button></div>`}).join("");
  el.querySelectorAll(".x").forEach(b=>b.onclick=()=>{if(confirm("「"+b.dataset.w+"」を削除しますか?")){words=words.filter(w=>w.word!==b.dataset.w);save();updBadge();renderList()}});
}
function renderRev(){
  const el=$("#rev"),d=due();
  if(!d.length){
    const nx=words.map(w=>w.due).sort((a,b)=>a-b)[0];
    el.innerHTML=`<div class="card c">今日の復習は完了です 🎉<div class="sub" style="margin-top:6px">${nx?"次の復習: "+new Date(nx).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}):"単語を追加しましょう"}</div></div>`;return}
  revCard=d[0];const c=revCard;
  el.innerHTML=`<div class="sub c">残り ${d.length} 語</div><div class="card c"><div class="w">${esc(c.word)}</div><div class="sub">${esc(c.pron)}</div>
  <button class="g" id="sp" style="margin-top:8px">🔊 発音</button>
  <div id="ans" class="hide" style="text-align:left;margin-top:12px"><ol>${c.meanings.map(m=>`<li>${esc(m)}</li>`).join("")}</ol>${c.example?`<div class="ex"><div>${esc(c.example)}</div><div class="sub">${esc(c.example_ja)}</div></div>`:""}</div>
  <button id="rv" style="width:100%;margin-top:14px">答えを見る</button>
  <div class="rate hide" id="rt"><button class="ng" data-r="0">忘れた</button><button class="mid" data-r="1">あいまい</button><button class="ok" data-r="2">覚えた</button></div></div>`;
  $("#sp").onclick=()=>speak(c.word);speak(c.word);
  $("#rv").onclick=()=>{$("#ans").classList.remove("hide");$("#rv").classList.add("hide");$("#rt").classList.remove("hide")};
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
function rate(r){
  const c=words.find(w=>w.word===revCard.word);if(!c)return;
  if(r===2)c.stage=Math.min(c.stage+1,INT.length);
  else if(r===0)c.stage=0;
  c.due=r===0?Date.now()+10*60*1e3:Date.now()+INT[Math.max(0,Math.min(c.stage,INT.length)-(r===2?1:0))]*DAY*(r===1?.5:1);
  if(r===2)c.due=Date.now()+INT[Math.min(c.stage,INT.length)-1]*DAY;
  save();updBadge();renderRev();
}
$("#sv").onclick=()=>{try{localStorage.setItem("tango.cfg",JSON.stringify({key:$("#key").value.trim(),model:$("#mdl").value.trim()}));$("#svm").textContent="保存しました"}catch(e){$("#svm").textContent="保存に失敗しました"}};
$("#tn").onclick=()=>{try{window.Android?Android.test():alert("通知はアプリ版で使えます")}catch(e){}};
let sent=null;
async function analyze(text){
  text=text.trim();if(!text)return;
  const res=$("#res"),btn=$("#sb");
  btn.disabled=true;res.innerHTML='<div class="card sub">分析しています…</div>';
  try{
    const r=await gem(`次の英文を単語ごとに順番に分割し、日本語で解説してください。JSONのみ。形式: {"translation":"全文の日本語訳","phrases":[{"text":"英語の単語(原文のまま)","pron":"句全体のIPA発音記号(スラッシュ付き)","pos":"品詞または種類(日本語)","meanings":["意味"],"note":"補足(任意)"}]}。ただし、熟語や句動詞は1つの句として扱い、働きの弱い前置詞(in,at,ofなど)や冠詞などは前後の語とまとめて(in the boxやthousands ofなど)1つの句としてください。\n英文: ${text}`);
    sent={text,tr:r.translation||"",items:(r.phrases||[]).map(p=>({word:String(p.text||"").trim().toLowerCase(),pron:p.pron||"",pos:p.pos||"",meanings:(p.meanings||[]).slice(0,3),example:text,example_ja:r.translation||"",note:p.note||""})).filter(p=>p.word)};
    renderSent();
  }catch(e){res.innerHTML=`<div class="card sub">分析に失敗しました(${esc(e.message)})。設定でAPIキーを確認してください。</div>`}
  btn.disabled=false;
}
function addItem(p){
  if(words.some(w=>w.word===p.word))return;
  const {note,...r}=p;words.push({...r,stage:0,due:Date.now()+DAY,added:Date.now()});
}
function renderSent(){
  const s=sent;
  $("#res").innerHTML=`<div class="card"><div>${esc(s.text)}</div><div class="sub">${esc(s.tr)}</div></div>`+
  s.items.map((p,i)=>{const has=words.some(w=>w.word===p.word);
    return `<div class="card item"><div><b>${esc(p.word)}</b> <span class="sub">${esc(p.pron)} ${esc(p.pos)}</span><div>${esc(p.meanings.join(" / "))}</div>${p.note?`<div class="sub">${esc(p.note)}</div>`:""}</div><button class="ad" data-i="${i}" ${has?"disabled":""}>${has?"追加済み":"追加"}</button></div>`}).join("")+
  `<button class="g" id="all" style="width:100%">すべて追加</button>`;
  document.querySelectorAll(".ad").forEach(b=>b.onclick=()=>{addItem(s.items[+b.dataset.i]);save();updBadge();renderSent()});
  $("#all").onclick=()=>{s.items.forEach(addItem);save();updBadge();renderSent()};
}
window.handleText=t=>{
  t=String(t||"").trim();if(!t)return;show("search");
  if(t.split(/\s+/).length<=3&&!/[.!?;]/.test(t)){$("#q").value=t.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"");lookup()}
  else{$("#txt").value=t;analyze(t)}
};
$("#sb").onclick=()=>analyze($("#txt").value);
$("#go").onclick=lookup;
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")lookup()});
load();updBadge();save();
try{if(window.Android&&Android.pending){const p=Android.pending();if(p)handleText(p)}}catch(e){}
</script>
</body>
</html>
